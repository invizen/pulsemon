services:
  pulsemon:
    build: .
    container_name: pulsemon
    ports:
      - "9299:9299"
      - "443:443"
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    environment:
      - PULSEMON_DB=/data/pulsemon.db
      - PULSEMON_CERT=/certs/cert.pem
      - PULSEMON_KEY=/certs/key.pem
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/pulsemon", "-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
