services:
  pulsemon:
    build: .
    container_name: pulsemon
    ports:
      - "9299:9299"
    volumes:
      - ./data:/data
    environment:
      - PULSEMON_DB=/data/pulsemon.db
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/pulsemon", "-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
