services:
  pulsemon:
    build: .
    container_name: pulsemon
    ports:
      - "9299:9299"
    volumes:
      - ./data:/data
    environment:
      - PULSEMON_DB=/data/pulsemon.db
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
    restart: unless-stopped
    # F20 (2026-10-19 review): the shutdown budget is 30s (in-flight probes
    # drain, DB closes); Docker's 10s default SIGKILLs mid-drain.
    stop_grace_period: 30s
    # Hardening (2026-10-19 review m13): no capabilities are needed (ICMP uses
    # the unprivileged datagram ping socket), and the root fs is read-only —
    # the DB and every file the app writes live on the /data volume.
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # K2 (2026-10-19 review): HTTP form — verifies the running server
      # answers /api/healthz, not just that the store opens.
      test: ["CMD", "/pulsemon", "-healthz-http"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
