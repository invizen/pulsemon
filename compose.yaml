services:
  pulsemon:
    build: .
    container_name: pulsemon
    ports:
      - "9299:9299"
    volumes:
      - ./data:/data
    environment:
      - PULSEMON_DB=/data/pulsemon.db
      - GOOGLE_CHAT_WEBHOOK_URL=${GOOGLE_CHAT_WEBHOOK_URL:-}
    restart: unless-stopped
    # Hardening (2026-10-19 review m13): no capabilities are needed (ICMP uses
    # the unprivileged datagram ping socket), and the root fs is read-only —
    # the DB and every file the app writes live on the /data volume.
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/pulsemon", "-healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
