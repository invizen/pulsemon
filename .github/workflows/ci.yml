name: CI

# Linux test gate: go vet + the full -race suite. Before this workflow the
# ONLY CI was the Windows release builder — nothing ran the tests, and
# release.sh runs `go test -count=1 .` (no -race, single package). For code
# this concurrent (probe worker, in-memory stats cache, per-sensor alert
# gates, storm budget), a data race caught in CI is the whole point
# (2026-10-23 external review F15).
#
# Benchmarks are NOT run here (no -bench flag): BenchmarkPurgeOld and
# BenchmarkComputeSensorStats (bench_test.go) are opt-in regression
# benchmarks — run them explicitly with
# `go test -run=^$ -bench=. -benchtime=1x .`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA, not mutable tags (2026-11-11
      # nit): a tag can be moved after review, and signed-release discipline
      # on our own artifacts is inconsistent with executing whoever controls
      # a third-party tag points at. Tags in the comments are the reviewed
      # provenance; bump = re-resolve the SHA (git ls-remote --tags).
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      # Vulnerability scan of the module graph against the public OSV.dev
      # database (stdlib + deps). No third-party action: plain tool install,
      # so the pinned-action trust chain stays two entries deep. A
      # known-vuln hit fails the job — triage = bump the dep, or record an
      # accepted-risk entry in docs/DECISIONS.md and pin the ignore.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
