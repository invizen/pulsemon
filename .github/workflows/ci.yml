name: CI

# Linux test gate: go vet + the full -race suite. Before this workflow the
# ONLY CI was the Windows release builder — nothing ran the tests, and
# release.sh runs `go test -count=1 .` (no -race, single package). For code
# this concurrent (probe worker, in-memory stats cache, per-sensor alert
# gates, storm budget), a data race caught in CI is the whole point
# (2026-10-23 external review F15).
#
# Benchmarks are NOT run here (no -bench flag): BenchmarkPurgeOld and
# BenchmarkComputeSensorStats (bench_test.go) are opt-in regression
# benchmarks — run them explicitly with
# `go test -run=^$ -bench=. -benchtime=1x .`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA, not mutable tags (2026-11-11
      # nit): a tag can be moved after review, and signed-release discipline
      # on our own artifacts is inconsistent with executing whoever controls
      # a third-party tag points at. Tags in the comments are the reviewed
      # provenance; bump = re-resolve the SHA (git ls-remote --tags).
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'

      - name: go vet
        run: go vet ./...

      - name: go test -race
        # Explicit -timeout: the default 10m panic bomb fires MID-SUITE on a
        # slow 2-core runner (full -race takes 8-12m here) and blames a
        # random in-flight test — 2026-11-20, run 44645698167 died at
        # 600.187s with TestFix_M9_ProvidersAreIndependentAndParallel 1s
        # into a run the gate box completes in 346s. 25m keeps real hangs
        # fatal with headroom for runner variance.
        run: go test -race -count=1 -timeout 25m ./...

      # Frontend regression pins (web/test/frontend.test.mjs): the Go gate
      # above never sees web/, so a JS-only push (no Go build needed) would
      # otherwise ship with zero automated coverage. The pins load the REAL
      # app.js into a node:vm sandbox — no npm, no package.json, no
      # third-party action — so the trust chain gains nothing. Node 22
      # matches the gate box (v22.23.5); the test file takes an explicit
      # path because Node 22's --test rejects a directory argument.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Frontend regression pins
        run: node --test web/test/frontend.test.mjs

      # Vulnerability scan of the module graph against the public OSV.dev
      # database (stdlib + deps). No third-party action: plain tool install,
      # so the pinned-action trust chain stays two entries deep. A
      # known-vuln hit fails the job — triage = bump the dep, or record an
      # accepted-risk entry in docs/DECISIONS.md and pin the ignore.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
